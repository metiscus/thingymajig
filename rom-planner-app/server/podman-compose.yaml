# rom-planner-collaborative/podman-compose.yaml
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Containerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_CORS_ORIGINS: "http://localhost:5173"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      # --- NEW: Pass RFI storage path to container environment ---
      # This allows override if needed, otherwise defaults to /app/media/rfi_uploads in config.py
      # RFI_STORAGE_BASE_PATH: "/app/media/rfi_uploads" # Example if you want to hardcode override here
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      # --- NEW: Volume for persistent RFI file storage ---
      - rfi_files_data:/app/media

volumes:
  db_data:
  # --- NEW: Define the named volume for RFI files ---
  rfi_files_data: